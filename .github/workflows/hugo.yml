# ─────────────────────────────────────────────────────────────────
# Deploy Hugo site to GitHub Pages
# Triggers on every push to main. Uses the official Hugo + GitHub
# Pages actions — no external dependencies needed.
# ─────────────────────────────────────────────────────────────────

name: Deploy Hugo to GitHub Pages

on:
  push:
    branches:
      - main          # trigger on push to main
  workflow_dispatch:  # allow manual runs from the GitHub UI

# Sets permissions so the workflow can write to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; cancel in-progress runs
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.165.0   # matches your local version
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout repository (with submodules for PaperMod theme)
        uses: actions/checkout@v4
        with:
          submodules: recursive   # fetches the PaperMod theme submodule
          fetch-depth: 0          # full history for .GitInfo and .Lastmod

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          # Use the GitHub Pages URL as the production base URL.
          # This is overridden per-site by the CNAME / custom domain setting.
          HUGO_ENVIRONMENT: production
          TZ: America/New_York
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
